<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#6c4cf5">
<title>Brain Blast!</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(160deg, #6c4cf5, #2bb5f5);
    color: #222; touch-action: manipulation; user-select: none;
    display: flex; justify-content: center;
  }
  .app { width: 100%; max-width: 560px; padding: 16px; display: flex; flex-direction: column; min-height: 100%; }
  .card { background: #fff; border-radius: 24px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
  .screen { display: none; flex: 1; flex-direction: column; gap: 16px; }
  .screen.on { display: flex; }

  h1 { color: #fff; text-align: center; font-size: 2.6rem; margin: 24px 0 0; text-shadow: 0 4px 0 rgba(0,0,0,.2); }
  .sub { color: #fff; text-align: center; font-size: 1.2rem; margin: 0; }
  .big-emoji { font-size: 5rem; text-align: center; line-height: 1.1; }
  .btn {
    border: none; border-radius: 18px; font: inherit; font-size: 1.4rem; font-weight: bold;
    padding: 18px; color: #fff; background: #ff8a00; box-shadow: 0 6px 0 #c76b00;
    cursor: pointer; transition: transform .05s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c76b00; }
  .btn.green { background: #22c55e; box-shadow: 0 6px 0 #15803d; }
  .best { color: #fff; text-align: center; font-size: 1.1rem; }

  .top { display: flex; align-items: center; gap: 12px; color: #fff; font-weight: bold; font-size: 1.1rem; }
  .bar { flex: 1; height: 14px; background: rgba(255,255,255,.3); border-radius: 7px; overflow: hidden; }
  .bar div { height: 100%; width: 0; background: #ffd400; transition: width .3s; }
  .card-head { display: flex; align-items: center; gap: 10px; }
  .tag { display: inline-block; background: #efeaff; color: #6c4cf5; border-radius: 99px; padding: 4px 12px; font-size: .9rem; font-weight: bold; }
  .timer { flex: 1; height: 10px; background: #eee; border-radius: 5px; overflow: hidden; }
  .timer div { height: 100%; width: 100%; background: #22c55e; }
  .timer div.low { background: #ef4444; }
  .secs { font-weight: bold; color: #6c4cf5; min-width: 2.2em; text-align: right; }
  .q { font-size: 1.4rem; font-weight: bold; text-align: center; margin: 8px 0 0; }

  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ans {
    border: none; border-radius: 16px; font: inherit; font-size: 1.2rem; font-weight: bold;
    padding: 18px 8px; background: #fff; color: #333; box-shadow: 0 6px 0 rgba(0,0,0,.15); cursor: pointer;
  }
  .ans.right { background: #22c55e; color: #fff; }
  .ans.wrong { background: #ef4444; color: #fff; }

  .slots, .tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .slot, .tile {
    width: min(48px, calc((100vw - 120px) / 6)); height: min(56px, calc((100vw - 120px) / 5.2));
    border-radius: 12px; font-size: min(1.7rem, 8vw); font-weight: bold;
    display: flex; align-items: center; justify-content: center; text-transform: uppercase;
  }
  .slot { background: #f1f1f6; border: 3px dashed #c9c3e8; color: #6c4cf5; }
  .slot.filled { border-style: solid; background: #fff; }
  .tile { background: #ffd400; box-shadow: 0 5px 0 #c9a600; border: none; font-family: inherit; color: #333; cursor: pointer; }
  .tile.used { visibility: hidden; }
  .shake { animation: shake .4s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-10px)} 75%{transform:translateX(10px)} }

  .feedback { text-align: center; font-size: 1.4rem; font-weight: bold; min-height: 2em; color: #fff; }
  .stars { font-size: min(2.2rem, 9vw); text-align: center; line-height: 1.3; }
  .score { font-size: 3rem; font-weight: bold; text-align: center; color: #6c4cf5; }
  .pop { animation: pop .4s; }
  @keyframes pop { 0%{transform:scale(.6)} 70%{transform:scale(1.15)} 100%{transform:scale(1)} }
</style>
</head>
<body>
<div class="app">

  <!-- START -->
  <div class="screen on" id="start">
    <h1>🧠 Brain Blast!</h1>
    <p class="sub">Quiz · Spelling · Maths</p>
    <div class="big-emoji">🔥</div>
    <p class="sub">10 tough questions, and the clock is ticking ⏱️<br>Get a ⭐ for every right answer!</p>
    <div style="flex:1"></div>
    <div class="best" id="bestStart"></div>
    <button class="btn" id="playBtn">▶ Play</button>
  </div>

  <!-- GAME -->
  <div class="screen" id="game">
    <div class="top">
      <span id="qNum">1/10</span>
      <div class="bar"><div id="barFill"></div></div>
      <span>⭐ <span id="starCount">0</span></span>
    </div>
    <div class="card" id="qCard"></div>
    <div class="feedback" id="feedback"></div>
    <div id="nextWrap" style="display:none"><button class="btn green" id="nextBtn" style="width:100%">Next ➜</button></div>
  </div>

  <!-- END -->
  <div class="screen" id="end">
    <h1 id="endTitle">Well done!</h1>
    <div class="card">
      <div class="score" id="endScore"></div>
      <div class="stars" id="endStars"></div>
      <p class="q" id="endMsg"></p>
    </div>
    <div class="best" id="bestEnd"></div>
    <div style="flex:1"></div>
    <button class="btn" id="againBtn">🔁 Play again</button>
  </div>

</div>
<script>
const TOTAL = 10;
const TIME = { quiz: 15, maths: 15, spell: 30 }; // seconds per question

const QUIZ = [
  ["🦴", "How many bones are in an adult human body?", "206", ["106", "186", "306"]],
  ["🌡️", "At what temperature does water boil?", "100°C", ["80°C", "150°C", "212°C"]],
  ["☀️", "Which planet is closest to the Sun?", "Mercury", ["Venus", "Mars", "Earth"]],
  ["🌍", "How many continents are there?", "7", ["5", "6", "8"]],
  ["🏔️", "What is the tallest mountain in the world?", "Everest", ["K2", "Kilimanjaro", "Ben Nevis"]],
  ["🏞️", "What is the longest river in the UK?", "Severn", ["Thames", "Trent", "Mersey"]],
  ["🐳", "What kind of animal is a whale?", "Mammal", ["Fish", "Reptile", "Amphibian"]],
  ["🦈", "What is a shark's skeleton made of?", "Cartilage", ["Bone", "Shell", "Scales"]],
  ["🌿", "Which gas do plants take in to make food?", "Carbon dioxide", ["Oxygen", "Helium", "Hydrogen"]],
  ["💎", "What is the hardest natural material?", "Diamond", ["Gold", "Iron", "Granite"]],
  ["🧱", "Which Roman emperor built a wall across northern England?", "Hadrian", ["Julius Caesar", "Nero", "Augustus"]],
  ["👑", "Who was the UK's monarch before King Charles III?", "Elizabeth II", ["Victoria", "George VI", "Elizabeth I"]],
  ["🔺", "In which country are the Great Pyramids of Giza?", "Egypt", ["Mexico", "Greece", "India"]],
  ["⏱️", "How many seconds are in an hour?", "3600", ["360", "600", "6000"]],
  ["📐", "How many degrees are in a right angle?", "90", ["45", "100", "180"]],
  ["🔺", "The angles in a triangle add up to…", "180°", ["90°", "270°", "360°"]],
  ["🔷", "What do you call a shape with 6 sides?", "Hexagon", ["Pentagon", "Octagon", "Heptagon"]],
  ["🛑", "How many sides does an octagon have?", "8", ["6", "7", "10"]],
  ["🗓️", "How many days are in a leap year?", "366", ["364", "365", "367"]],
  ["🌙", "Who was the first person to walk on the Moon?", "Neil Armstrong", ["Buzz Aldrin", "Yuri Gagarin", "Tim Peake"]],
  ["🧪", "What is H₂O?", "Water", ["Salt", "Air", "Gold"]],
  ["🌡️", "Which metal is a liquid at room temperature?", "Mercury", ["Iron", "Copper", "Lead"]],
  ["🇦🇺", "What is the capital city of Australia?", "Canberra", ["Sydney", "Melbourne", "Perth"]],
  ["🇨🇦", "What is the capital city of Canada?", "Ottawa", ["Toronto", "Vancouver", "Montreal"]],
  ["🏜️", "What is the largest hot desert in the world?", "Sahara", ["Gobi", "Kalahari", "Arabian"]],
  ["🐆", "What is the fastest land animal?", "Cheetah", ["Lion", "Horse", "Greyhound"]],
  ["🦁", "What is a group of lions called?", "Pride", ["Pack", "Herd", "School"]],
  ["🥚", "Which bird lays the biggest eggs?", "Ostrich", ["Eagle", "Swan", "Emu"]],
  ["🎻", "How many strings does a violin have?", "4", ["5", "6", "3"]],
  ["🎹", "How many keys are on a standard piano?", "88", ["66", "77", "100"]],
  ["✍️", "What is a word that describes a noun called?", "Adjective", ["Verb", "Adverb", "Pronoun"]],
  ["🐕", "In “The dog ran quickly”, which word is the adverb?", "quickly", ["dog", "ran", "The"]],
  ["🏛️", "What is 50 in Roman numerals?", "L", ["V", "C", "D"]],
  ["🏛️", "What number is XIV in Roman numerals?", "14", ["9", "16", "41"]],
  ["🧍", "What is the largest organ of the human body?", "Skin", ["Liver", "Brain", "Heart"]],
  ["💡", "Roughly how long does sunlight take to reach Earth?", "8 minutes", ["8 seconds", "8 hours", "8 days"]],
  ["🏴󠁧󠁢󠁳󠁣󠁴󠁿", "What is the capital city of Scotland?", "Edinburgh", ["Glasgow", "Aberdeen", "Dundee"]],
  ["🏴󠁧󠁢󠁷󠁬󠁳󠁿", "What is the capital city of Wales?", "Cardiff", ["Swansea", "Newport", "Bangor"]],
  ["🧊", "Which of these is NOT a state of matter?", "Energy", ["Solid", "Liquid", "Gas"]],
  ["🦕", "Which dinosaur had three horns on its face?", "Triceratops", ["Stegosaurus", "T. rex", "Diplodocus"]],
  ["🐊", "Which of these is a reptile?", "Crocodile", ["Frog", "Newt", "Salamander"]],
  ["🕷️", "Spiders are not insects. What are they?", "Arachnids", ["Reptiles", "Crustaceans", "Mammals"]],
  ["🐜", "How many legs does an insect have?", "6", ["4", "8", "10"]],
  ["🐄", "What do we call an animal that eats only plants?", "Herbivore", ["Carnivore", "Omnivore", "Predator"]],
  ["⚔️", "In what year was the Battle of Hastings?", "1066", ["1215", "1666", "1945"]],
  ["🔥", "In what year was the Great Fire of London?", "1666", ["1066", "1605", "1766"]],
  ["💍", "Which king of England had six wives?", "Henry VIII", ["Henry V", "Richard III", "Edward VI"]],
  ["🌊", "Which ocean lies between Europe and America?", "Atlantic", ["Pacific", "Indian", "Arctic"]],
  ["🔭", "Which is the biggest planet in our solar system?", "Jupiter", ["Saturn", "Neptune", "Uranus"]],
  ["🧲", "What force pulls things down towards the Earth?", "Gravity", ["Friction", "Magnetism", "Electricity"]],
];

const WORDS = [
  ["🐘","elephant"],["🦒","giraffe"],["🐧","penguin"],["🐬","dolphin"],["🐙","octopus"],
  ["🐊","crocodile"],["🦋","butterfly"],["☂️","umbrella"],["🌈","rainbow"],["🌋","volcano"],
  ["✂️","scissors"],["🐿️","squirrel"],["🦘","kangaroo"],["🦔","hedgehog"],["🔭","telescope"],
  ["🥦","broccoli"],["🍍","pineapple"],["🍓","strawberry"],["🥪","sandwich"],["💀","skeleton"],
  ["🚑","ambulance"],["🚁","helicopter"],["🦕","dinosaur"],["🐢","tortoise"],["🍫","chocolate"],
  ["⚡","lightning"],["🎺","trumpet"],["🎸","guitar"],["⌨️","keyboard"],["📅","calendar"],
  ["✉️","envelope"],["🔬","microscope"],["🦟","mosquito"],["🦩","flamingo"],["🥑","avocado"],
  ["🥒","cucumber"],["🍝","spaghetti"],["🧲","magnet"],["🏰","castle"],["🧭","compass"],
];

const PRAISE = ["⭐ Brilliant!", "⭐ Genius!", "⭐ Amazing!", "⭐ Nailed it!", "⭐ Fantastic!", "⭐ Brain power!"];

const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rand(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };

let questions, idx, stars, locked, timer;

function makeMaths() {
  const kind = pick(["times", "divide", "bigtimes", "add", "sub", "missing", "order"]);
  let text, ans;
  if (kind === "times") {
    const a = rand(6, 12), b = rand(6, 12);
    text = `${a} × ${b} = ?`; ans = a * b;
  } else if (kind === "divide") {
    const b = rand(3, 12), c = rand(3, 12);
    text = `${b * c} ÷ ${b} = ?`; ans = c;
  } else if (kind === "bigtimes") {
    const a = rand(13, 99), b = rand(3, 9);
    text = `${a} × ${b} = ?`; ans = a * b;
  } else if (kind === "add") {
    const a = rand(150, 899), b = rand(150, 899);
    text = `${a} + ${b} = ?`; ans = a + b;
  } else if (kind === "sub") {
    const a = rand(400, 999), b = rand(120, a - 50);
    text = `${a} − ${b} = ?`; ans = a - b;
  } else if (kind === "missing") {
    const a = rand(4, 12), b = rand(4, 12);
    text = `? × ${b} = ${a * b}`; ans = a;
  } else {
    const a = rand(2, 20), b = rand(2, 9), c = rand(2, 9);
    text = `${a} + ${b} × ${c} = ?`; ans = a + b * c;
  }
  const wrong = new Set();
  const offsets = shuffle([1, -1, 2, -2, 10, -10, 3, -3, 5, -5]);
  if (kind === "order") wrong.add(String((text.match(/\d+/g).map(Number)).reduce((x, y, i) => i === 1 ? x + y : x * y))); // the "left to right" mistake
  for (const o of offsets) {
    if (wrong.size >= 3) break;
    if (ans + o >= 0) wrong.add(String(ans + o));
  }
  return { type: "maths", label: "Maths", emoji: "🧮", text, answer: String(ans), wrong: [...wrong] };
}

function buildGame() {
  const quiz = shuffle(QUIZ).slice(0, 4).map(([emoji, text, answer, wrong]) =>
    ({ type: "quiz", label: "Quiz", emoji, text, answer, wrong }));
  const spell = shuffle(WORDS).slice(0, 3).map(([emoji, word]) =>
    ({ type: "spell", label: "Spelling", emoji, word }));
  const maths = [makeMaths(), makeMaths(), makeMaths()];
  return shuffle([...quiz, ...spell, ...maths]);
}

function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id));
}

const BEST_KEY = "brainBlastBestHard";
function best() { return Number(localStorage.getItem(BEST_KEY) || 0); }
function showBest() {
  const b = best();
  const txt = b ? `🏆 Best score: ${b} / ${TOTAL}` : "";
  $("bestStart").textContent = txt; $("bestEnd").textContent = txt;
}

function start() {
  questions = buildGame(); idx = 0; stars = 0;
  $("starCount").textContent = 0;
  show("game"); render();
}

function startTimer(secs, onTimeout) {
  stopTimer();
  const fill = $("timerFill"), label = $("timerSecs");
  const end = Date.now() + secs * 1000;
  const tick = () => {
    const left = Math.max(0, end - Date.now());
    fill.style.width = `${(left / (secs * 1000)) * 100}%`;
    fill.classList.toggle("low", left < 5000);
    label.textContent = `${Math.ceil(left / 1000)}s`;
    if (left === 0) { stopTimer(); onTimeout(); }
  };
  tick();
  timer = setInterval(tick, 100);
}
function stopTimer() { clearInterval(timer); timer = null; }

function head(q) {
  return `<div class="card-head"><span class="tag">${q.label}</span>
    <div class="timer"><div id="timerFill"></div></div><span class="secs" id="timerSecs"></span></div>`;
}

function render() {
  locked = false;
  const q = questions[idx];
  $("qNum").textContent = `${idx + 1}/${TOTAL}`;
  $("barFill").style.width = `${(idx / TOTAL) * 100}%`;
  $("feedback").textContent = "";
  $("nextWrap").style.display = "none";
  const card = $("qCard");
  card.classList.remove("pop"); void card.offsetWidth; card.classList.add("pop");

  if (q.type === "spell") return renderSpell(q, card);

  card.innerHTML = `${head(q)}
    <div class="big-emoji">${q.emoji}</div>
    <p class="q">${q.text}</p>`;
  const grid = document.createElement("div");
  grid.className = "answers"; grid.style.marginTop = "16px";
  const showRight = () => [...grid.children].find(x => x.textContent === q.answer).classList.add("right");
  shuffle([q.answer, ...q.wrong]).forEach(opt => {
    const b = document.createElement("button");
    b.className = "ans"; b.textContent = opt;
    b.onclick = () => {
      if (locked) return; locked = true;
      if (opt === q.answer) { b.classList.add("right"); correct(); }
      else { b.classList.add("wrong"); showRight(); miss(`Nearly! It was ${q.answer}`); }
    };
    grid.appendChild(b);
  });
  card.appendChild(grid);
  startTimer(TIME[q.type], () => { locked = true; showRight(); miss(`⏰ Time's up! It was ${q.answer}`); });
}

function renderSpell(q, card) {
  const word = q.word;
  const decoys = Array.from({ length: 3 }, () => pick("abcdefghijklmnoprstuwy".split("")));
  const letters = shuffle([...word.split(""), ...decoys]);
  let tries = 0;
  const placed = []; // tile index per slot

  card.innerHTML = `${head(q)}
    <div class="big-emoji">${q.emoji}</div>
    <p class="q">Spell the word! <small style="color:#999">(watch out for extra letters)</small></p>`;
  const slots = document.createElement("div"); slots.className = "slots"; slots.style.margin = "16px 0";
  const tiles = document.createElement("div"); tiles.className = "tiles";
  card.append(slots, tiles);

  const tileEls = letters.map((ch, i) => {
    const t = document.createElement("button");
    t.className = "tile"; t.textContent = ch;
    t.onclick = () => {
      if (locked || placed.length >= word.length) return;
      placed.push(i); t.classList.add("used"); draw();
      if (placed.length === word.length) check();
    };
    tiles.appendChild(t);
    return t;
  });

  const slotEls = word.split("").map((_, s) => {
    const el = document.createElement("div");
    el.className = "slot";
    el.onclick = () => { // tap a letter to send it (and everything after it) back
      if (locked || s >= placed.length) return;
      placed.splice(s).forEach(i => tileEls[i].classList.remove("used"));
      draw();
    };
    slots.appendChild(el);
    return el;
  });

  function draw() {
    slotEls.forEach((el, s) => {
      const has = s < placed.length;
      el.textContent = has ? letters[placed[s]] : "";
      el.classList.toggle("filled", has);
    });
  }

  function check() {
    const guess = placed.map(i => letters[i]).join("");
    if (guess === word) return void (locked = true, correct());
    tries++;
    slots.classList.remove("shake"); void slots.offsetWidth; slots.classList.add("shake");
    if (tries < 2) {
      $("feedback").textContent = "Oops! One more try 🙂";
      setTimeout(() => {
        if (locked) return;
        placed.splice(0).forEach(i => tileEls[i].classList.remove("used")); draw();
      }, 500);
    } else {
      locked = true;
      miss(`Nearly! It was ${word.toUpperCase()}`);
    }
  }

  startTimer(TIME.spell, () => { locked = true; miss(`⏰ Time's up! It was ${word.toUpperCase()}`); });
}

function correct() {
  stopTimer();
  stars++;
  $("starCount").textContent = stars;
  $("feedback").textContent = pick(PRAISE);
  setTimeout(next, 1100);
}

function miss(message) {
  stopTimer();
  $("feedback").textContent = message;
  $("nextWrap").style.display = "block";
}

function next() {
  idx++;
  if (idx < TOTAL) return render();
  $("barFill").style.width = "100%";
  finish();
}

function finish() {
  const isBest = stars > best();
  if (isBest) localStorage.setItem(BEST_KEY, stars);
  $("endScore").textContent = `${stars} / ${TOTAL}`;
  const row = [..."⭐".repeat(stars) + "☆".repeat(TOTAL - stars)];
  $("endStars").innerHTML = row.slice(0, 5).join("") + "<br>" + row.slice(5).join("");
  $("endTitle").textContent = stars >= 8 ? "🏆 Superstar!" : stars >= 5 ? "🎉 Well done!" : "👍 Good try!";
  $("endMsg").textContent = isBest && stars > 0 ? "New best score! 🎊" :
    stars === TOTAL ? "Every single one right!" : "Play again to get more stars!";
  showBest();
  show("end");
}

$("playBtn").onclick = start;
$("againBtn").onclick = start;
$("nextBtn").onclick = next;
showBest();
</script>
</body>
</html>
