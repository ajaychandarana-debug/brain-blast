<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#6c4cf5">
<title>Brain Blast!</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(160deg, #6c4cf5, #2bb5f5);
    color: #222; touch-action: manipulation; user-select: none;
    display: flex; justify-content: center;
  }
  .app { width: 100%; max-width: 560px; padding: 16px; display: flex; flex-direction: column; min-height: 100%; }
  .card { background: #fff; border-radius: 24px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
  .screen { display: none; flex: 1; flex-direction: column; gap: 16px; }
  .screen.on { display: flex; }

  h1 { color: #fff; text-align: center; font-size: 2.6rem; margin: 24px 0 0; text-shadow: 0 4px 0 rgba(0,0,0,.2); }
  .sub { color: #fff; text-align: center; font-size: 1.2rem; margin: 0; }
  .big-emoji { font-size: 5rem; text-align: center; line-height: 1.1; }
  .btn {
    border: none; border-radius: 18px; font: inherit; font-size: 1.4rem; font-weight: bold;
    padding: 18px; color: #fff; background: #ff8a00; box-shadow: 0 6px 0 #c76b00;
    cursor: pointer; transition: transform .05s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c76b00; }
  .btn.green { background: #22c55e; box-shadow: 0 6px 0 #15803d; }
  .best { color: #fff; text-align: center; font-size: 1.1rem; }

  .top { display: flex; align-items: center; gap: 12px; color: #fff; font-weight: bold; font-size: 1.1rem; }
  .bar { flex: 1; height: 14px; background: rgba(255,255,255,.3); border-radius: 7px; overflow: hidden; }
  .bar div { height: 100%; width: 0; background: #ffd400; transition: width .3s; }
  .tag { display: inline-block; background: #efeaff; color: #6c4cf5; border-radius: 99px; padding: 4px 12px; font-size: .9rem; font-weight: bold; }
  .q { font-size: 1.5rem; font-weight: bold; text-align: center; margin: 8px 0 0; }

  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ans {
    border: none; border-radius: 16px; font: inherit; font-size: 1.3rem; font-weight: bold;
    padding: 20px 8px; background: #fff; color: #333; box-shadow: 0 6px 0 rgba(0,0,0,.15); cursor: pointer;
  }
  .ans.right { background: #22c55e; color: #fff; }
  .ans.wrong { background: #ef4444; color: #fff; }

  .slots, .tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .slot, .tile {
    width: min(52px, calc((100vw - 120px) / 6)); height: min(60px, calc((100vw - 120px) / 5.2));
    border-radius: 12px; font-size: min(1.8rem, 8vw); font-weight: bold;
    display: flex; align-items: center; justify-content: center; text-transform: uppercase;
  }
  .slot { background: #f1f1f6; border: 3px dashed #c9c3e8; color: #6c4cf5; }
  .slot.filled { border-style: solid; background: #fff; }
  .tile { background: #ffd400; box-shadow: 0 5px 0 #c9a600; border: none; font-family: inherit; color: #333; cursor: pointer; }
  .tile.used { visibility: hidden; }
  .shake { animation: shake .4s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-10px)} 75%{transform:translateX(10px)} }

  .feedback { text-align: center; font-size: 1.4rem; font-weight: bold; min-height: 2em; color: #fff; }
  .stars { font-size: min(2.2rem, 9vw); text-align: center; line-height: 1.3; }
  .score { font-size: 3rem; font-weight: bold; text-align: center; color: #6c4cf5; }
  .pop { animation: pop .4s; }
  @keyframes pop { 0%{transform:scale(.6)} 70%{transform:scale(1.15)} 100%{transform:scale(1)} }
</style>
</head>
<body>
<div class="app">

  <!-- START -->
  <div class="screen on" id="start">
    <h1>🧠 Brain Blast!</h1>
    <p class="sub">Quiz · Spelling · Maths</p>
    <div class="big-emoji">🚀</div>
    <p class="sub">10 questions. Get a ⭐ for every right answer!</p>
    <div style="flex:1"></div>
    <div class="best" id="bestStart"></div>
    <button class="btn" id="playBtn">▶ Play</button>
  </div>

  <!-- GAME -->
  <div class="screen" id="game">
    <div class="top">
      <span id="qNum">1/10</span>
      <div class="bar"><div id="barFill"></div></div>
      <span>⭐ <span id="starCount">0</span></span>
    </div>
    <div class="card" id="qCard"></div>
    <div class="feedback" id="feedback"></div>
    <div id="nextWrap" style="display:none"><button class="btn green" id="nextBtn" style="width:100%">Next ➜</button></div>
  </div>

  <!-- END -->
  <div class="screen" id="end">
    <h1 id="endTitle">Well done!</h1>
    <div class="card">
      <div class="score" id="endScore"></div>
      <div class="stars" id="endStars"></div>
      <p class="q" id="endMsg"></p>
    </div>
    <div class="best" id="bestEnd"></div>
    <div style="flex:1"></div>
    <button class="btn" id="againBtn">🔁 Play again</button>
  </div>

</div>
<script>
const TOTAL = 10;

const QUIZ = [
  ["🕷️", "How many legs does a spider have?", "8", ["6", "10", "4"]],
  ["🐙", "How many arms does an octopus have?", "8", ["6", "10", "12"]],
  ["🌈", "How many colours are in a rainbow?", "7", ["5", "6", "8"]],
  ["🐋", "What is the biggest animal ever?", "Blue whale", ["Elephant", "Giraffe", "Shark"]],
  ["🦒", "Which animal has the longest neck?", "Giraffe", ["Horse", "Camel", "Zebra"]],
  ["🌍", "Which planet do we live on?", "Earth", ["Mars", "Jupiter", "Venus"]],
  ["☀️", "What is the Sun?", "A star", ["A planet", "A moon", "A cloud"]],
  ["🐧", "Which bird can't fly but is great at swimming?", "Penguin", ["Eagle", "Parrot", "Owl"]],
  ["🧊", "What is ice made of?", "Water", ["Glass", "Sugar", "Salt"]],
  ["🦘", "Which country do kangaroos come from?", "Australia", ["France", "Canada", "Egypt"]],
  ["🐝", "What do bees make?", "Honey", ["Milk", "Jam", "Butter"]],
  ["🍎", "Which of these is a fruit?", "Apple", ["Carrot", "Potato", "Onion"]],
  ["📅", "How many days are in a week?", "7", ["5", "6", "10"]],
  ["🗓️", "How many months are in a year?", "12", ["10", "11", "13"]],
  ["🐸", "A baby frog is called a…", "Tadpole", ["Kitten", "Cub", "Calf"]],
  ["🦁", "A baby lion is called a…", "Cub", ["Puppy", "Foal", "Chick"]],
  ["🪐", "Which is the biggest planet?", "Jupiter", ["Earth", "Mars", "Mercury"]],
  ["🔺", "How many sides does a triangle have?", "3", ["4", "5", "6"]],
  ["⬛", "How many sides does a square have?", "4", ["3", "5", "6"]],
  ["👑", "What is the capital city of England?", "London", ["Paris", "Rome", "Madrid"]],
  ["🖐️", "How many fingers are on two hands?", "10", ["8", "12", "5"]],
  ["🧲", "What will a magnet stick to?", "Iron", ["Wood", "Plastic", "Glass"]],
  ["🌱", "What do plants need from the Sun?", "Light", ["Sand", "Milk", "Noise"]],
  ["🦇", "Which animal sleeps upside down?", "Bat", ["Dog", "Fish", "Cat"]],
  ["🌊", "Which is the biggest ocean?", "Pacific", ["Atlantic", "Indian", "Arctic"]],
  ["❄️", "Water turns to ice at…", "0°C", ["10°C", "50°C", "100°C"]],
  ["🦕", "When did dinosaurs live?", "Millions of years ago", ["Last year", "100 years ago", "Today"]],
  ["🐌", "Which animal carries its home on its back?", "Snail", ["Dog", "Fish", "Bird"]],
  ["🥚", "Which of these animals lays eggs?", "Chicken", ["Cow", "Dog", "Horse"]],
  ["⚽", "How many players does a football team have on the pitch?", "11", ["9", "10", "12"]],
];

const WORDS = [
  ["🐱","cat"],["🐶","dog"],["🐟","fish"],["🐸","frog"],["🐦","bird"],["⭐","star"],
  ["🌙","moon"],["☀️","sun"],["🌳","tree"],["🎂","cake"],["🍎","apple"],["🏠","house"],
  ["🚂","train"],["📖","book"],["🚢","ship"],["🦆","duck"],["🐴","horse"],["🕐","clock"],
  ["🍕","pizza"],["🍌","banana"],["🤖","robot"],["🚀","rocket"],["🐍","snake"],["🐭","mouse"],
  ["🪑","chair"],["✏️","pencil"],["🐯","tiger"],["🦓","zebra"],["🐑","sheep"],["🐝","bee"],
];

const PRAISE = ["⭐ Brilliant!", "⭐ Super!", "⭐ Amazing!", "⭐ Well done!", "⭐ Fantastic!", "⭐ You got it!"];

const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rand(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };

let questions, idx, stars, locked;

function makeMaths() {
  const kind = pick(["times", "times", "add", "sub"]);
  let text, ans, emoji;
  if (kind === "times") {
    const a = rand(2, 10), b = rand(1, 10);
    text = `${a} × ${b} = ?`; ans = a * b; emoji = "✖️";
  } else if (kind === "add") {
    const a = rand(5, 50), b = rand(3, 40);
    text = `${a} + ${b} = ?`; ans = a + b; emoji = "➕";
  } else {
    const a = rand(12, 60), b = rand(2, a - 2);
    text = `${a} − ${b} = ?`; ans = a - b; emoji = "➖";
  }
  const wrong = new Set();
  const offsets = shuffle([1, -1, 2, -2, 10, -10, 3, -3, 5, -5]);
  for (const o of offsets) {
    const v = ans + o;
    if (v >= 0 && v !== ans) wrong.add(String(v));
    if (wrong.size === 3) break;
  }
  return { type: "maths", label: "Maths", emoji, text, answer: String(ans), wrong: [...wrong] };
}

function buildGame() {
  const quiz = shuffle(QUIZ).slice(0, 4).map(([emoji, text, answer, wrong]) =>
    ({ type: "quiz", label: "Quiz", emoji, text, answer, wrong }));
  const spell = shuffle(WORDS).slice(0, 3).map(([emoji, word]) =>
    ({ type: "spell", label: "Spelling", emoji, word }));
  const maths = [makeMaths(), makeMaths(), makeMaths()];
  return shuffle([...quiz, ...spell, ...maths]);
}

function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id));
}

function best() { return Number(localStorage.getItem("brainBlastBest") || 0); }
function showBest() {
  const b = best();
  const txt = b ? `🏆 Best score: ${b} / ${TOTAL}` : "";
  $("bestStart").textContent = txt; $("bestEnd").textContent = txt;
}

function start() {
  questions = buildGame(); idx = 0; stars = 0;
  $("starCount").textContent = 0;
  show("game"); render();
}

function render() {
  locked = false;
  const q = questions[idx];
  $("qNum").textContent = `${idx + 1}/${TOTAL}`;
  $("barFill").style.width = `${(idx / TOTAL) * 100}%`;
  $("feedback").textContent = "";
  $("nextWrap").style.display = "none";
  const card = $("qCard");
  card.classList.remove("pop"); void card.offsetWidth; card.classList.add("pop");

  if (q.type === "spell") return renderSpell(q, card);

  card.innerHTML = `
    <span class="tag">${q.label}</span>
    <div class="big-emoji">${q.emoji}</div>
    <p class="q">${q.text}</p>`;
  const grid = document.createElement("div");
  grid.className = "answers"; grid.style.marginTop = "16px";
  shuffle([q.answer, ...q.wrong]).forEach(opt => {
    const b = document.createElement("button");
    b.className = "ans"; b.textContent = opt;
    b.onclick = () => {
      if (locked) return; locked = true;
      if (opt === q.answer) { b.classList.add("right"); correct(); }
      else {
        b.classList.add("wrong");
        [...grid.children].find(x => x.textContent === q.answer).classList.add("right");
        miss(q.answer);
      }
    };
    grid.appendChild(b);
  });
  card.appendChild(grid);
}

function renderSpell(q, card) {
  const word = q.word;
  let letters = shuffle(word.split(""));
  for (let i = 0; i < 5 && letters.join("") === word; i++) letters = shuffle(word.split(""));
  let tries = 0;
  const placed = []; // tile index per slot

  card.innerHTML = `
    <span class="tag">${q.label}</span>
    <div class="big-emoji">${q.emoji}</div>
    <p class="q">Spell the word!</p>`;
  const slots = document.createElement("div"); slots.className = "slots"; slots.style.margin = "16px 0";
  const tiles = document.createElement("div"); tiles.className = "tiles";
  card.append(slots, tiles);

  const tileEls = letters.map((ch, i) => {
    const t = document.createElement("button");
    t.className = "tile"; t.textContent = ch;
    t.onclick = () => {
      if (locked || placed.length >= word.length) return;
      placed.push(i); t.classList.add("used"); draw();
      if (placed.length === word.length) check();
    };
    tiles.appendChild(t);
    return t;
  });

  const slotEls = word.split("").map((_, s) => {
    const el = document.createElement("div");
    el.className = "slot";
    el.onclick = () => { // tap a letter to send it (and everything after it) back
      if (locked || s >= placed.length) return;
      placed.splice(s).forEach(i => tileEls[i].classList.remove("used"));
      draw();
    };
    slots.appendChild(el);
    return el;
  });

  function draw() {
    slotEls.forEach((el, s) => {
      const has = s < placed.length;
      el.textContent = has ? letters[placed[s]] : "";
      el.classList.toggle("filled", has);
    });
  }

  function check() {
    const guess = placed.map(i => letters[i]).join("");
    if (guess === word) return void (locked = true, correct());
    tries++;
    slots.classList.remove("shake"); void slots.offsetWidth; slots.classList.add("shake");
    if (tries < 2) {
      $("feedback").textContent = "Oops! Try again 🙂";
      setTimeout(() => {
        placed.splice(0).forEach(i => tileEls[i].classList.remove("used")); draw();
      }, 500);
    } else {
      locked = true;
      miss(word.toUpperCase());
    }
  }
}

function correct() {
  stars++;
  $("starCount").textContent = stars;
  $("feedback").textContent = pick(PRAISE);
  setTimeout(next, 1100);
}

function miss(answer) {
  $("feedback").textContent = `Nearly! It was ${answer}`;
  $("nextWrap").style.display = "block";
}

function next() {
  idx++;
  if (idx < TOTAL) return render();
  $("barFill").style.width = "100%";
  finish();
}

function finish() {
  const isBest = stars > best();
  if (isBest) localStorage.setItem("brainBlastBest", stars);
  $("endScore").textContent = `${stars} / ${TOTAL}`;
  const row = [..."⭐".repeat(stars) + "☆".repeat(TOTAL - stars)];
  $("endStars").innerHTML = row.slice(0, 5).join("") + "<br>" + row.slice(5).join("");
  $("endTitle").textContent = stars >= 8 ? "🏆 Superstar!" : stars >= 5 ? "🎉 Well done!" : "👍 Good try!";
  $("endMsg").textContent = isBest && stars > 0 ? "New best score! 🎊" :
    stars === TOTAL ? "Every single one right!" : "Play again to get more stars!";
  showBest();
  show("end");
}

$("playBtn").onclick = start;
$("againBtn").onclick = start;
$("nextBtn").onclick = next;
showBest();
</script>
</body>
</html>
